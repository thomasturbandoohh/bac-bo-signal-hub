name: Format ESLint files

on:
  push:
    branches:
      - chore/format-eslint

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-eslint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only the files reported by ESLint
        run: >
          bunx prettier --write
          src/lib/auth-middleware.ts
          src/routes/_authenticated/_approved/admin.tsx
          src/components/bacbo/LiveTable.tsx
          src/lib/robot-context.tsx
          src/routes/_authenticated/_approved/robos.tsx
          src/routes/auth.tsx
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth-middleware.ts src/routes/_authenticated/_approved/admin.tsx src/components/bacbo/LiveTable.tsx src/lib/robot-context.tsx src/routes/_authenticated/_approved/robos.tsx src/routes/auth.tsx
          git commit -m "style: format files flagged by ESLint"
          git push origin HEAD:chore/format-eslint
